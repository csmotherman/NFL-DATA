name: Thursday NFL Edge

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "requirements.txt"
      - "inputs/**"
      - ".github/workflows/thursday-nfl-edge.yml"
  schedule:
    - cron: "0 12 * * 4"
      timezone: "America/Detroit"
  workflow_dispatch:
    inputs:
      season:
        description: "Season override (blank = auto)"
        required: false
        type: string
      week:
        description: "Week override (blank = auto)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nfl-edge-weekly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore nflverse cache
        uses: actions/cache@v4
        with:
          path: .nfl_cache
          key: nflreadpy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nflreadpy-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile src/nfl_edge.py src/market_strategy.py src/player_props.py src/fantasy_ros.py src/fetch_prop_lines.py src/grade_game_history.py src/lock_forward_props.py src/grade_prop_history.py src/fantasy_leaderboard.py

      - name: Run weekly model
        shell: bash
        run: |
          ARGS=(--auto --output-dir outputs)
          if [[ -n "${{ inputs.season }}" ]]; then
            ARGS+=(--season "${{ inputs.season }}")
          fi
          if [[ -n "${{ inputs.week }}" ]]; then
            ARGS+=(--week "${{ inputs.week }}")
          fi
          python src/nfl_edge.py "${ARGS[@]}"

      - name: Build and grade game betting ledger
        run: |
          python src/grade_game_history.py \
            --predictions outputs/latest_predictions.csv \
            --model-report outputs/model_report.json \
            --archive-dir outputs/game_predictions \
            --output-dir outputs

      - name: Fetch live player prop lines
        shell: bash
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: |
          if [[ -z "$PROPLINE_API_KEY" ]]; then
            echo "PROPLINE_API_KEY is not configured; using any existing/manual prop-line input."
          else
            python src/fetch_prop_lines.py --output inputs/player_prop_lines.csv --archive-dir outputs/prop_line_snapshots
          fi

      - name: Run player prop models
        shell: bash
        run: |
          ARGS=(--auto --output-dir outputs --input-dir inputs)
          if [[ -n "${{ inputs.season }}" ]]; then
            ARGS+=(--season "${{ inputs.season }}")
          fi
          if [[ -n "${{ inputs.week }}" ]]; then
            ARGS+=(--week "${{ inputs.week }}")
          fi
          python src/player_props.py "${ARGS[@]}"

      - name: Run fantasy ROS model
        shell: bash
        run: |
          SEASON="${{ inputs.season }}"
          if [[ -z "$SEASON" ]]; then
            SEASON="$(date +%Y)"
          fi
          python src/fantasy_ros.py \
            --season "$SEASON" \
            --output-dir outputs

      - name: Build opponent-adjusted fantasy leaderboard
        shell: bash
        run: |
          SEASON="${{ inputs.season }}"
          if [[ -z "$SEASON" ]]; then
            SEASON="$(date +%Y)"
          fi
          python src/fantasy_leaderboard.py \
            --season "$SEASON" \
            --output outputs/fantasy_leaderboard.csv

      - name: Lock forward player prop edges
        run: |
          python src/lock_forward_props.py \
            --edges outputs/latest_player_prop_edges.csv \
            --archive-dir outputs/player_edges_locked

      - name: Grade settled forward prop history
        run: |
          python src/grade_prop_history.py \
            --edge-dir outputs/player_edges_locked \
            --output-dir outputs

      - name: Upload model outputs
        uses: actions/upload-artifact@v4
        with:
          name: nfl-edge-${{ github.run_number }}
          path: outputs/
          retention-days: 90

      - name: Commit refreshed outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "data: refresh weekly NFL betting edges"
          # Main may have changed while the model was training. Rebase the
          # generated-output commit instead of failing with a non-fast-forward.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
